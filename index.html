<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7dedd">
<title>Abdelrahman &amp; Menna — Engagement Invitation</title>
<style>
*{box-sizing:border-box}
:root{--rose:#bd777c;--rose-dark:#a95f66;--cream:#fff8f4}
body{margin:0;padding:22px 14px 34px;background:linear-gradient(145deg,#f9e7e4,#f2d0cf);font-family:Georgia,'Times New Roman',serif;color:#713e3e;min-height:100vh}
main{width:min(100%,720px);margin:0 auto;text-align:center}
.invitation{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 14px 38px #77494b30}
.actions{padding:22px 12px 0}
.map-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;max-width:100%;border-radius:999px;background:var(--rose);color:#fff;text-decoration:none;font:600 16px Arial,sans-serif;box-shadow:0 7px 18px #b96f7533;transition:background .2s,transform .2s}
.map-button:hover{background:var(--rose-dark);transform:translateY(-2px)}
.note{margin:14px 0 0;font-size:13px;color:#865b5b;line-height:1.6}
</style>
</head>
<body>
<main>
  <img class="invitation" src="invitation-design.png" alt="Engagement invitation for Abdelrahman and Menna, 16 October, Obour">
  <div class="actions">
    <a class="map-button" href="https://maps.app.goo.gl/ymgf7KFgRzDRCF9o9" target="_blank" rel="noopener noreferrer">📍 Open location in Google Maps ↗</a>
    <p class="note">Abdelrahman &amp; Menna · 16 October · Obour</p>
  </div>
</main>
</body>
</html>
